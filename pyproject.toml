[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codepet-ai"
version = "0.1.0"
description = "Local programming tutor and desktop companion"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "httpx>=0.27,<1", "pydantic-settings>=2.6,<3", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2"]

[project.optional-dependencies]
desktop = ["PySide6>=6.8,<7", "websockets>=14,<18"]
mcp = ["mcp>=1.26,<2"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[project.scripts]
codepet-server = "backend.app.main:run"
codepet-desktop = "apps.desktop.main:run"
codepet-mcp = "backend.app.mcp.server:run"

[tool.hatch.build]
exclude = ["apps/vscode-extension/**", "**/__pycache__/**"]

[tool.hatch.build.targets.wheel]
packages = ["backend", "apps"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: requires a running local Ollama", "desktop: requires PySide6"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
