name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install --yes libegl1 libpulse0 espeak-ng ripgrep bubblewrap
      - run: python -m pip install --upgrade pip
      - run: python -m pip install uv
      - run: uv lock --check
      - run: uv sync --locked --extra dev --extra mcp --extra desktop
      - run: uv run pytest -q
      - run: uv run ruff check backend apps scripts tests migrations
      - run: CODEPET_DATABASE=.codepet/ci-memory.db uv run alembic upgrade head
      - run: CODEPET_DATABASE=.codepet/ci-memory.db uv run alembic check

  vscode-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/vscode-extension
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/vscode-extension/package-lock.json
      - run: npm ci
      - run: npm test
